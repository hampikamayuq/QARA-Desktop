[package]
name = "qara-desktop"
version = "0.1.0"
edition = "2024"
description = "Interactive QARA desktop surface for Pop!_OS/COSMIC"
license = "MIT"

[dependencies]
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
webkit6 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
